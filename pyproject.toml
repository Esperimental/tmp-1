[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver"
version = "0.1.0"
description = "A deliberately small, restartable agent experiment"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "socksio>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evolver = "evolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
