name: Live agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVOLVER_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Require OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Start from unreconciled objective
        run: rm -rf .evolver

      - name: Run live Luna agent
        run: evolver run

      - name: Verify restart reconciliation
        run: evolver status

      - name: Show sanitized evidence
        run: |
          echo "Generated plan:"
          jq . .evolver/plan.json
          echo "Persisted proposal:"
          jq . .evolver/proposal.json
          echo "Verified execution:"
          jq . .evolver/runs.jsonl

      - name: Upload agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: evolver-evidence
          path: .evolver/
          if-no-files-found: error
