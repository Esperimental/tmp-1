name: Quality pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  live-smoke-eval:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVOLVER_MODEL: gpt-5.6-luna
      EVOLVER_EVAL_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Require OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Start from unreconciled objective
        run: rm -rf .evolver

      - name: Run live Luna smoke task
        run: evolver run

      - name: Verify restart reconciliation
        run: evolver status

      - name: Run independent model evaluation
        run: evolver evaluate-smoke

      - name: Show sanitized evidence
        if: always()
        run: |
          for file in .evolver/plan.json .evolver/proposal.json .evolver/runs.jsonl .evolver/evaluations/hello-world-smoke.json .evolver/evaluations/report.md; do
            if [ -f "$file" ]; then
              echo "$file:"
              jq . "$file"
            fi
          done

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolver-evidence
          path: .evolver/
          include-hidden-files: true
          if-no-files-found: warn
