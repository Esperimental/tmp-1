name: Quality pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traditional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  simple-ai-tests:
    if: github.event_name != 'pull_request'
    needs: traditional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVOLVER_MODEL: gpt-5.6-luna
      EVOLVER_EVAL_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Require OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Run and evaluate simple task suite
        run: |
          rm -rf .evolver
          evolver eval phase simple --output-dir .evolver/evaluations

      - name: Show sanitized evidence
        if: always()
        run: |
          for file in .evolver/evaluations/*.json .evolver/evaluations/report.md; do
            if [ -f "$file" ]; then
              echo "$file:"
              case "$file" in
                *.json|*.jsonl) jq . "$file" ;;
                *) cat "$file" ;;
              esac
            fi
          done

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolver-evidence
          path: .evolver/
          include-hidden-files: true
          if-no-files-found: warn

  mid-range-ai-tests:
    needs: simple-ai-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVOLVER_MODEL: gpt-5.6-luna
      EVOLVER_EVAL_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run isolated mid-range task
        run: evolver eval phase mid-range --output-dir .evolver/evaluations

      - name: Show mid-range report
        if: always()
        run: |
          if [ -f .evolver/evaluations/report.md ]; then
            cat .evolver/evaluations/report.md
          fi

      - name: Upload mid-range evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolver-mid-range-evidence
          path: .evolver/
          include-hidden-files: true
          if-no-files-found: warn

  complex-ai-tests:
    name: complex-ai-tests (reserved)
    needs: mid-range-ai-tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reserved until the mid-range phase is established."
