name: Quality pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traditional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  simple-ai-tests:
    if: github.event_name != 'pull_request'
    needs: traditional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVOLVER_MODEL: gpt-5.6-luna
      EVOLVER_EVAL_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Require OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Run and evaluate simple task suite
        run: |
          rm -rf .evolver
          mkdir -p .evolver/evaluations
          evaluation_dir="$PWD/.evolver/evaluations"
          for task in evals/simple/*; do
            task_id="$(basename "$task")"
            work_dir="$(mktemp -d)"
            cp -R "$task/." "$work_dir/"
            echo "::group::Simple task: $task_id"
            (
              cd "$work_dir"
              evolver run
              evolver status
              evolver evaluate-task \
                --task-id "$task_id" \
                --output "$evaluation_dir/$task_id.json"
            )
            echo "::endgroup::"
          done
          evolver report-suite \
            --input-dir .evolver/evaluations \
            --output .evolver/evaluations/report.md

      - name: Show sanitized evidence
        if: always()
        run: |
          for file in .evolver/evaluations/*.json .evolver/evaluations/report.md; do
            if [ -f "$file" ]; then
              echo "$file:"
              case "$file" in
                *.json|*.jsonl) jq . "$file" ;;
                *) cat "$file" ;;
              esac
            fi
          done

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolver-evidence
          path: .evolver/
          include-hidden-files: true
          if-no-files-found: warn

  mid-range-ai-tests:
    name: mid-range-ai-tests (reserved)
    needs: simple-ai-tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reserved until the simple phase is consistently reliable."

  complex-ai-tests:
    name: complex-ai-tests (reserved)
    needs: mid-range-ai-tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reserved until the mid-range phase is established."
